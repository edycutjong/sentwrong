<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 320" width="1280" height="320" role="img" aria-label="Sent Wrong — routes a misdirected transfer: paste the address you sent to, the Nansen label lands, one of four recovery routes turns green and the ticket is drafted">
<!-- STORYBOARD (dur 8s — the single master dur of this file)
  0-8%    steady state: plate + grid + mini mark + outlined "Sent Wrong" + tagline + metric + stack; right: the address pill and four grey routes with labels (poster)
  8-22%   trigger:      a blue packet flies from the mark into the address pill; the pill's ring turns blue          data-story="beat-2"
  22-55%  mechanism:    The address arrives unknown in blue; the Nansen label lands, one of four routes turns green, three go dark.
                        — the label tag "Binance: Deposit" drops onto the pill; route 1 (Exchange deposit) draws green; routes 2-4 dim   data-story="beat-3"
  55-80%  resolution:   the ticket card pops at the end of route 1 with a green tick; the lit route + card persist to the seam   data-story="beat-4"
  80-100% breathe (glow on the lit route re-pulses at 84% — the echo) + seam fade 96-100%, fade-in 0-2%
-->
