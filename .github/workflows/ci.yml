name: ci
on: [push, pull_request]
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: npm }
      - run: npm ci
      - run: npm run typecheck
      - run: npm run typecheck -w apps/web
      - run: npm test
      # replays the 13 recorded fixtures with NANSEN_OFFLINE=1 — no API key, no network, every decision hash must match
      - run: npm run verify
      - run: npm run check:submission
